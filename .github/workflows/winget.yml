name: Publish to WinGet
on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Get Version
        id: get-version
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $cleanTag =$tag -replace '^v', ''
          $parts =$cleanTag.Split('.')
          
          $version = "{0}.{1}.{2}.{3}" -f [int]$parts[0], [int]$parts[1], [int]$parts[2], [int]$parts[3]
          
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              Write-Error "Invalid release tag: ${{ github.event.release.tag_name }}"
              exit 1
          }
          
          Write-Output "VERSION=$version" \vert{} Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Submit Package
        id: submit-package
        run: |
          $assets = '${{ toJSON(github.event.release.assets) }}' | ConvertFrom-Json
          $installerUrl =$assets | Where-Object -Property name -like '*.exe' | Select-Object -ExpandProperty browser_download_url

          if (-not $installerUrl) {
              Write-Error "Could not find a .exe asset in the release."
              exit 1
          }
          
          curl.exe -JLO https://aka.ms/wingetcreate/latest
          .\wingetcreate.exe update Klocman.BulkCrapUninstaller `
            --version $env:VERSION `
            --urls $installerUrl `
            --submit `
            --token ${{ secrets.WINGET_TOKEN }}
